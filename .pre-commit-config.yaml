repos:
  - repo: https://github.com/mwouts/jupytext
    rev: v1.19.5
    hooks:
      - id: jupytext
        args: [--sync]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args: [--extra-keys=metadata.language_info.version cell.metadata.execution]
